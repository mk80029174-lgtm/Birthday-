<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Happy Birthday Sagar</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{min-height:100vh;overflow:hidden;text-align:center;color:#fff;background:linear-gradient(-45deg,#ff4e8a,#7b5cff,#3f8cff,#ff8fb1);background-size:400% 400%;animation:bg 12s ease infinite}@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}.card{width:min(92%,420px);margin:40px auto;background:rgba(255,255,255,.15);backdrop-filter:blur(12px);padding:24px;border-radius:22px}.gift{font-size:95px;cursor:pointer;animation:b 1s infinite}@keyframes b{50%{transform:translateY(-10px)}}#letter{display:none;background:#fff;color:#333;border-radius:18px;padding:18px;margin-top:20px}button{margin-top:15px;padding:10px 22px;border:none;border-radius:30px;background:#ff4081;color:#fff}</style></head><body><div class='card'><h1>🎉 Happy Birthday 🎉</h1><h2>Sagar ❤️</h2><p id='m'></p><div class='gift' id='g' onclick='o()'>🎁</div><p id='t'>Tap the Gift 🎁</p><div id='letter'><h2>💖 Dear Sagar 💖</h2><p>Wishing you happiness, success, good health and endless smiles. Thank you for being an amazing friend. 🎂</p><button onclick='c()'>Close</button></div></div><script>let x='May your birthday be filled with joy and unforgettable memories! ✨',i=0;(function y(){if(i<x.length){m.innerHTML+=x[i++];setTimeout(y,35)}})();setInterval(()=>{let h=document.createElement('div');h.textContent=Math.random()>.5?'❤️':'💖';h.style.cssText='position:fixed;left:'+Math.random()*100+'vw;bottom:-20px;font-size:22px;transition:7s linear';document.body.appendChild(h);setTimeout(()=>{h.style.transform='translateY(-120vh)';h.style.opacity=0},10);setTimeout(()=>h.remove(),7100)},350);function o(){g.style.display='none';t.style.display='none';letter.style.display='block';for(let i=0;i<100;i++){let s=document.createElement('div');s.style.cssText='position:fixed;left:50vw;top:45vh;width:6px;height:6px;border-radius:50%;background:hsl('+Math.random()*360+',100%,50%)';document.body.appendChild(s);setTimeout(()=>{s.style.transition='1s';s.style.transform='translate('+((Math.random()-.5)*700)+'px,'+((Math.random()-.5)*700)+'px)';s.style.opacity=0},20);setTimeout(()=>s.remove(),1200)}}function c(){letter.style.display='none';g.style.display='block';t.style.display='block'}</script></body></html>
